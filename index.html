<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imagine City — Winter Tale</title><link rel="stylesheet" href="style.css"></head><body>
<div class="opening-screen" id="openingScreen" aria-label="Imagine City หน้าต้อนรับ">
  <div class="opening-scene-bg"></div>
  <div class="opening-stars" aria-hidden="true">✦　✧　✦</div>
  <div class="opening-heading"><h1>Imagine City</h1><p>คืนสุดท้ายก่อนสีจะหายไป</p><div class="opening-divider" aria-hidden="true">✦</div></div>
</div>
<main class="scene" id="scene"><div class="backdrop"></div><div class="city-illumination" id="cityIllumination"></div><div class="stage-backdrop" aria-hidden="true"></div><div class="window-bloom"></div><div class="shade"></div><div class="snow" id="snow"></div><div class="haze haze-a"></div><div class="haze haze-b"></div><div class="vignette"></div>
<aside class="story-progress" aria-label="ความคืบหน้าของเนื้อเรื่อง"><div id="progressTrack" class="story-progress-track" role="progressbar" aria-label="การเดินทาง" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="story-progress-fill"></div><div class="story-progress-marker" aria-hidden="true">✦</div></div></aside><div class="lumin-slot" id="luminSlot" hidden><button type="button" class="lumin" id="lumin" aria-label="Lumin สีเหลือง กดเพื่อเปลี่ยนสี"><img id="luminImage" src="assets/lumin-yellow.png" alt="" draggable="false"></button></div><section class="content" id="content" aria-live="polite"></section><footer class="controls"><button id="next" class="next" type="button">เดินทางต่อ <span>→</span></button></footer><button class="sound" id="motion" aria-pressed="true">✧ Motion เปิด</button></main>
<audio id="backgroundMusic" src="assets/background-music.mp3" preload="auto" loop></audio><button class="music-toggle" id="musicToggle" type="button" aria-label="เปิดเพลงประกอบ" aria-pressed="false">♫ เปิดเพลง</button>
<div class="transition" id="transition" aria-hidden="true"><div class="veil v1"></div><div class="veil v2"></div><div class="veil v3"></div></div><script src="chapters.js"></script><script src="script.js"></script></body></html>
